services:
  postgres:
    image: postgres:latest
    container_name: postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: trends_db
    ports:
      - "5432:5432"
    volumes:
      - ./storage:/docker-entrypoint-initdb.d
    networks:
      - bigdata-net

  mongodb:
    image: mongo:latest
    container_name: mongodb
    ports:
      - "27017:27017"
    volumes:
      - ./storage:/docker-entrypoint-initdb.d
    networks:
      - bigdata-net

  dashboard:
    build: ./dashboard
    container_name: dashboard
    ports:
      - "8501:8501"
    volumes:
      - ./dashboard:/app
    depends_on:
      - postgres
      - mongodb
    networks:
      - bigdata-net
    restart: unless-stopped

networks:
  bigdata-net:
    driver: bridge
